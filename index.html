
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Pipeline Status</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            padding: 50px 35px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
            max-width: 650px;
            width: 90%;
        }

        .status {
            color: #4ade80;
            font-size: 18px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 18px;
        }

        p {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #94a3b8;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 26px;
            }

            .container {
                padding: 35px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="status">✓ PIPELINE SUCCESS</div>

        <h1>Jenkins pipeline working properly</h1>

        <p>
            Your application has been deployed successfully.
            The Jenkins pipeline is running as expected.
        </p>

        <div class="footer">
            Powered by Jenkins | Build • Test • Deploy
        </div>
    </div>
</body>
</html>
